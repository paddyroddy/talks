---
project:
  resources:
    - _assets/json/human.json
  type: website

execute:
  cache: true

format:
  html:
    include-in-header:
      - _assets/html/goat-counter.html
      - _assets/html/human-json.html
    theme: darkly
  revealjs:
    auto-play-media: true
    auto-stretch: false
    callout-appearance: simple
    code-copy: true
    filters:
      - _filters/slugify.lua
    footer: "{{< meta title >}}"
    hash-type: number
    height: 720
    history: false
    include-after-body: _assets/html/hide-title-slide.html
    include-in-header:
      - _assets/html/goat-counter.html
      - _assets/html/human-json.html
    incremental: true
    link-external-filter: ^https:\/\/paddyroddy\.github\.io
    link-external-icon: true
    logo: _assets/images/paddy.png
    margin: 0.1
    max-scale: 4
    mermaid:
      theme: dark
    menu:
      hideMissingTitles: true
      useTextContentForMissingTitles: false
    min-scale: 0.2
    mobile-view-distance: 10
    slide-number: c
    theme:
      - dark
      - _assets/css/custom.scss
    title-slide-attributes:
      data-footer: false
    transition: fade
    view-distance: 10
    width: 1280

website:
  favicon: _assets/images/favicon.ico
  navbar:
    tools:
      - icon: house
        href: https://paddyroddy.github.io
      - icon: github
        href: https://github.com/paddyroddy/talks
  site-url: https://paddyroddy.github.io/talks
  title: Patrick Roddy

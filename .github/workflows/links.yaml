---
name: Links

on:
  push:
    branches:
      - main
      - renovate/**
  pull_request:

jobs:
  links:
    permissions:
      contents: read
    runs-on: ubuntu-slim
    timeout-minutes: 2
    steps:
      # yamllint disable-line rule:line-length
      - uses: paddyroddy/.github/actions/links@626ab242bf611add6f1b7af17aa24f8bf12c5521 # v0
        with:
          branch: ${{ github.event.pull_request.head.sha || github.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          lychee-args:
            --exclude-path ^_extensions/ --no-progress --root-dir ${{
            github.workspace }} --verbose .

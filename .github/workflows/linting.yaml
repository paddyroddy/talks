---
name: Linting

on:
  push:
    branches:
      - main
      - renovate/**
  pull_request:

jobs:
  linting:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-slim
    steps:
      # yamllint disable-line rule:line-length
      - uses: paddyroddy/.github/actions/linting@83e4318ccc66b10ceda3c829fca47a15b380b14d # v0
        with:
          pre-commit-config: ./.pre-commit-config.yaml

      # yamllint disable-line rule:line-length
      - uses: paddyroddy/.github/actions/vale@83e4318ccc66b10ceda3c829fca47a15b380b14d # v0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
